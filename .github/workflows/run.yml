name: Railgun Checkin

on:
  workflow_dispatch:          # 手动触发
  schedule:
    - cron: '30 1 * * *'     # UTC 1:30 (北京时间 9:30)
    - cron: '30 13 * * *'    # UTC 13:30 (北京时间 21:30)

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run checkin
        run: npm run main
        env:
          RAILGUN_COOKIE: ${{ secrets.RAILGUN_COOKIE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
